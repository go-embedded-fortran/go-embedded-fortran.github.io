[params]
  description = "go-embedded-fortran (in development, fortran v0.16.0): Fortran in pure Go, with a front end (syntax and semantic analysis), an evaluator that runs all 14 golden programs byte-identical to gfortran 15.2.0, an I/O runtime ported from flang-rt, an oracle harness and a measured gate, for the fortran cells of go-notebook."

